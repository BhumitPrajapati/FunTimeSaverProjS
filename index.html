<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BP Resume Builder</title>
</head>
<link rel="stylesheet" href="style.css" />

<body>
    <div class="container">
        <h1>The more doors you knock, the sooner one will open.</h1>
        <form id="docForm">
            <input type="text" id="textInput" placeholder="Type something..." required />
            <button type="submit">Generate Document</button>
        </form>
    </div>

    <script>
        document.getElementById('docForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const text = document.getElementById('textInput').value;
            // const response = await fetch('http://localhost:3000/generate-doc', {
            const response = await fetch('https://ai-resumebuilder-c8vz.onrender.com/generate-doc', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: text }),
            });

            if (!response.ok) {
                alert("Error generating document.");
                return;
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'document.docx';
            a.click();
            window.URL.revokeObjectURL(url);
        });
    </script>
</body>

</html>
