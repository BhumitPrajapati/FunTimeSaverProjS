<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Generate Word Document</title>
</head>

<body>
    <h1>Word Document Generator</h1>
    <form id="docForm">
        <input type="text" id="textInput" placeholder="Enter your text" required />
        <button type="submit">Generate Document</button>
    </form>

    <script>
        document.getElementById('docForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const text = document.getElementById('textInput').value;

            const response = await fetch('http://localhost:3000/generate-doc', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: text }),
            });

            if (!response.ok) {
                alert("Error generating document.");
                return;
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'document.docx';
            a.click();
            window.URL.revokeObjectURL(url);
        });
    </script>
</body>

</html>
